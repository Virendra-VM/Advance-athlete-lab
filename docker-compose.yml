services:
  postgres:
    image: postgres:16-alpine
    container_name: athlete_lab_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: athlete
      POSTGRES_PASSWORD: athlete
      POSTGRES_DB: athlete_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athlete -d athlete_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
